name: Release

# Builds the macOS and Windows packages, then publishes both in one release
# when triggered by a version tag.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.3.0) — no leading v"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: prepare
    # Apple Silicon, which is what x86_64 cross-compiles from; Sequoia, for
    # the macOS 15 SDK the app itself requires.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # SwiftPM's own cache of fetched dependencies (SFBAudioEngine and its
      # binary frameworks), keyed on what is pinned — a change there is the
      # only thing that should ever miss.
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: |
            MacOS/.build/checkouts
            MacOS/.build/artifacts
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('MacOS/Package.resolved') }}
          restore-keys: spm-

      - name: Build FLACintosh.app and the disk image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        working-directory: MacOS
        run: scripts/package.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: FLACintosh-${{ needs.prepare.outputs.version }}
          path: MacOS/dist/FLACintosh-*.dmg
          if-no-files-found: error

  build-windows:
    needs: prepare
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Show toolchain
        shell: pwsh
        run: dotnet --info

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Windows/**/*.csproj', 'Windows/**/packages.lock.json') }}
          restore-keys: nuget-

      - name: Build FLACintosh.exe package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        shell: pwsh
        run: ./Windows/scripts/package-win-exe.ps1 -Version "${{ needs.prepare.outputs.version }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: FLACintosh-Windows-${{ needs.prepare.outputs.version }}
          path: Windows/artifacts/win-x64/FLACintosh.exe
          if-no-files-found: error

  publish:
    needs: [prepare, build-macos, build-windows]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: FLACintosh-${{ needs.prepare.outputs.version }}
          path: dist/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: FLACintosh-Windows-${{ needs.prepare.outputs.version }}
          path: dist/windows

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: FLACintosh v${{ needs.prepare.outputs.version }}
          files: |
            dist/macos/FLACintosh-*.dmg
            dist/windows/FLACintosh.exe
          generate_release_notes: true
          body: |
            macOS: ad hoc signed, not notarized — the first launch needs
            **System Settings → Privacy & Security → Open Anyway**.

            Windows: x64 build distributed as a standalone FLACintosh.exe.
